[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sillok-lm"
version = "0.1.0"
description = "From-scratch generative language model for the Annals of the Joseon Dynasty (조선왕조실록)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "tokenizers>=0.15.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
logging = ["wandb>=0.16.0"]

[tool.setuptools.packages.find]
where = ["src"]
