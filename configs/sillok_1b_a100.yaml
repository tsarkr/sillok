# Sillok-LM 1B Configuration (Colab Pro A100 40GB / 80GB)
# Analytical parameter count: ~1.014B (uses gradient checkpointing for A100 40GB safety)

model:
  vocab_size: 32768
  hidden_size: 2048
  intermediate_size: 5632
  num_hidden_layers: 21
  num_attention_heads: 16
  num_key_value_heads: 4
  max_seq_len: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_word_embeddings: true
  dropout: 0.0
  use_gradient_checkpointing: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  train_bin: "data/processed/train.bin"
  val_bin: "data/processed/val.bin"
  output_dir: "checkpoints/sillok_1b"
  batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 25000
  warmup_steps: 1500
  learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 40
  save_interval: 500
  log_interval: 20
  num_workers: 2
  dtype: "bfloat16"
  token_dtype: "uint16"
  compile_model: true
  resume_from: "auto"
  seed: 42
  wandb_project: null
