# Sillok-LM Tiny Debug Configuration (Smoke test / CPU or Colab T4 quick validation)
# Analytical parameter count: ~5.0M (4,981,888)

model:
  vocab_size: 32768
  hidden_size: 128
  intermediate_size: 384
  num_hidden_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 2
  max_seq_len: 256
  rms_norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_word_embeddings: true
  dropout: 0.0
  use_gradient_checkpointing: false
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  train_bin: "data/processed/train.bin"
  val_bin: "data/processed/val.bin"
  output_dir: "checkpoints/sillok_tiny"
  batch_size: 4
  gradient_accumulation_steps: 2
  max_steps: 50
  warmup_steps: 10
  learning_rate: 5.0e-4
  min_learning_rate: 5.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 5
  save_interval: 100
  max_keep_checkpoints: 3
  log_interval: 10
  num_workers: 0
  dtype: "float32"
  token_dtype: "uint16"
  compile_model: false
  resume_from: "auto"
  seed: 42
  wandb_project: null
