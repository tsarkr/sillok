# Apple Silicon MPS training (48 GB unified memory recommended)
model:
  vocab_size: 32768
  hidden_size: 1024
  intermediate_size: 3072
  num_hidden_layers: 26
  num_attention_heads: 16
  num_key_value_heads: 4
  max_seq_len: 1024
  rms_norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_word_embeddings: true
  dropout: 0.0
  use_gradient_checkpointing: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  train_bin: "data/processed/train.bin"
  val_bin: "data/processed/val.bin"
  output_dir: "checkpoints/sillok_350m"
  batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 5000
  warmup_steps: 300
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 5
  save_interval: 500
  max_keep_checkpoints: 1
  log_interval: 1
  num_workers: 0
  dtype: "bfloat16"
  token_dtype: "uint16"
  compile_model: false
  resume_from: "auto"
  seed: 42
  wandb_project: null
