# Sillok-LM 100M Configuration (Colab T4 16GB VRAM)
# Analytical parameter count: 100,682,496 (~100.7M)

model:
  vocab_size: 32768
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 12
  num_attention_heads: 12
  num_key_value_heads: 4
  max_seq_len: 1024
  rms_norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_word_embeddings: true
  dropout: 0.0
  use_gradient_checkpointing: false
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

training:
  train_bin: "data/processed/train.bin"
  val_bin: "data/processed/val.bin"
  output_dir: "checkpoints/sillok_100m_t4"
  batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 15000
  warmup_steps: 800
  learning_rate: 4.0e-4
  min_learning_rate: 4.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 200
  eval_steps: 30
  save_interval: 200
  max_keep_checkpoints: 3
  log_interval: 20
  num_workers: 2
  dtype: "float16"
  token_dtype: "uint16"
  compile_model: false
  resume_from: "auto"
  seed: 42
  wandb_project: null
